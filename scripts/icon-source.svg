<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond : la variable background du thème sombre, oklch(0.185 0 0). -->
  <path fill="#1b1b1b" d="M0 0h500v500H0z"/>
  <!--
    Le motif dit ce que fait l'application : du stock qui se déplace.
    Un carton, et une flèche qui en sort vers un détenteur. Pas de texte,
    pas de dégradé : à 32 px un aplat blanc sur fond sombre reste lisible,
    un dégradé devient une tache.
  -->
  <g fill="none" stroke="#fafafa" stroke-width="26" stroke-linejoin="round" stroke-linecap="round">
    <path d="M104 214h180v170H104z"/>
    <path d="M104 214 152 150h84l48 64"/>
    <path d="M194 150v64"/>
  </g>
  <!-- La flèche de sortie porte le mouvement. En gris pour ne pas
       concurrencer le carton, qui reste la forme reconnaissable. -->
  <g fill="none" stroke="#8f8f8f" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M316 306h74"/>
    <path d="M356 262l52 44-52 44"/>
  </g>
</svg>
